# --- Appearance & Window ---
font_family      JetBrains Mono Bold
italic_font      auto
bold_italic_font auto
font_size        15.0
modify_lines     hint:1.0

# Window Decor & Padding
hide_window_decorations yes
window_padding_width    0

# Start in fullscreen (replaces the 'gui-startup' lua event)
startup_session         none
start_as_maximized			yes
start_as_fullscreen     yes

# Tabs
show_tab_bar       no

# --- Audio ---
enable_audio_bell no

# --- Shell ---
# Automatically launch tmux
shell tmux

# --- Keybindings ---
# Clear default shortcuts (matches disable_default_key_bindings = true)
clear_all_shortcuts yes

# Fullscreen Toggle
map ctrl+shift+enter toggle_fullscreen

# Copy / Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font Size
map ctrl+shift+plus change_font_size all +2.0
map ctrl+kp_add      change_font_size all +2.0
map ctrl+minus       change_font_size all -2.0

# Copy Mode (Scrollback buffer)
map ctrl+shift+x show_scrollback
