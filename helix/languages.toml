[[language]]
name = "java"
language-servers = ["jdtls"]

[language-server.jdtls]
command = "sh"
args = [
  "-c",
  '''
  LOMBOK=$(find "$HOME/.m2/repository/org/projectlombok/lombok" -name "lombok-*.jar" -type f | sort -V | tail -n 1)
  if [ -z "$LOMBOK" ]; then
    echo "Lombok JAR not found" >&2
    exit 1
  fi
  exec jdtls --jvm-arg="-javaagent:$LOMBOK"
  '''
]

[[language]]
name = "go"
language-servers = ["gopls"]

[language-server.gopls]
command = "gopls"

[[language]]
name = "python"
language-servers = [ "basedpyright" ]

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[[language]]
name = "javascript"
auto-format = true
language-servers = [
  { name = "efm-lsp-prettier", only-features = [ "format" ] },
  { name = "efm-lsp-eslint", only-features = [ "format" ] },
  { name = "typescript-language-server", except-features = [ "format" ] }
]