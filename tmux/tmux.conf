# Reload config without restarting tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set-option -g default-shell /bin/fish
set-option -g focus-events on
set-option -a terminal-features 'XXX:RGB'
set-window-option -g mode-keys vi

set -g xterm-keys on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Status bar tweaks
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right " %H:%M %d-%b "
set -g status-right-length 51

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# copy the selected text to the system clipboard and exit copy mode using xclip (X11)
#bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# copy the selected text to the system clipboard and exit copy mode using Wayland
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

bind-key -n M-t if-shell -F '#{==:#{session_name},#{b:pane_current_path}}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 80% -E 'tmux new-session -A -s (tmux display-message -p "#{b:pane_current_path}")'
}

bind-key -n M-< previous-window
bind-key -n M-> next-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
