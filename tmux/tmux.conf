# Reload config without restarting tmux
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Set the default shell to POSIX sh
set-option -g default-shell /bin/zsh
# Ensure new windows use the default shell
set-option -g default-command "/bin/zsh -l"

set-option -g mouse off 
set-option -g default-terminal "tmux-256color"

set-option -g focus-events on
set-option -a terminal-features 'XXX:RGB'
set-window-option -g mode-keys vi

set-option -g xterm-keys on

# Start windows and panes at 1, not 0
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set-option -g renumber-windows on

set-option -g pane-border-lines simple
set-option -g pane-border-style fg=black,bright
set-option -g pane-active-border-style fg=magenta

# Faster key repetition
set-option -g escape-time 0
set-option -g repeat-time 1000

unbind-key c
bind-key c command-prompt -I "" -p "Window name:" \
  'if-shell -F "#{==:%%,}" "new-window" "new-window -n \"%1\""'

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

bind-key -T copy-mode-vi M-j run-shell "i=0; while [ \$i -lt 12 ]; do tmux send-keys -X scroll-down; sleep 0.01; i=\$((i+1)); done"
bind-key -T copy-mode-vi M-k run-shell "i=0; while [ \$i -lt 12 ]; do tmux send-keys -X scroll-up; sleep 0.01; i=\$((i+1)); done"

if-shell '[ "$(uname -s)" = "Linux" ]' {
	set-option -g set-clipboard on
	# copy the selected text to the system clipboard and exit copy mode using Wayland
	bind-key -T copy-mode-vi y send -X copy-selection-and-cancel \;\
  	run-shell "tmux save-buffer - | wl-copy"
}

if-shell '[ "$(uname -s)" = "Darwin" ]' {
	set-option -g set-clipboard on
	bind-key -T copy-mode-vi y send -X copy-selection-and-cancel \;\
  	run-shell "tmux save-buffer - | pbcopy"
}

bind-key -n M-t if-shell \
  "[ \"$(tmux display-message -p '#{session_name}')\" = \"$(tmux display-message -p '#{b:pane_current_path}')\" ]" \
  "detach-client" \
  "display-popup -d '#{pane_current_path}' -x C -y C -w 90% -h 80% -E 'tmux new-session -A -s \"$(tmux display-message -p \"#{b:pane_current_path}\")\"'"

bind-key -n M-< previous-window
bind-key -n M-> next-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key v display-popup -x C -y C -w 90% -h 80% -E 'cd $HOME/.config/nvim/ && nvim .'
bind-key t display-popup -x C -y C -w 90% -h 80% -E 'cd $HOME/.config/tmux/ && nvim .'

bind-key F display-popup -w 50% -h 80% \
	'. "$HOME/.config/.profile"; while true; sleep 10; do clear; greeting; done'

# Status bar tweaks
set-option -g status-left ""
set-option -g status-right '#(gitmux -cfg $HOME/.config/tmux/plugins/gitmux/gitmux.conf "#{pane_current_path}")'
set-option -g status-interval 2
set-option -g window-status-format "#I:#W"
set-option -g window-status-current-format "[#I:#W]"

